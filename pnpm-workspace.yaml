sharedWorkspaceLockfile: true
# Workaround: pnpm 11 fails to detect the running Node version for engine checks
# of optional dependencies (e.g. @oxlint/binding-*, @rolldown/binding-*).
# Without this, platform-specific binaries with engines "^20.19.0 || >=22.12.0" are skipped.
nodeVersion: 22.22.3

allowBuilds:
  "@swc/core": true
  contentful-cli: true
  esbuild: true
  oxlint: true
  oxfmt: true
  spawn-sync: true
  unrs-resolver: true
